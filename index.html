# KrtlMusic Tek HTML (Çalışan Sürüm)

```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrtlMusic</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#111;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar{
    width:250px;
    background:#1b1b1b;
    padding:15px;
    border-right:2px solid #333;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin-bottom:20px;
    color:#00ff99;
}

.music-item{
    background:#2a2a2a;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.2s;
}

.music-item:hover{
    background:#00ff99;
    color:black;
}

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    background:#1e1e1e;
    padding:30px;
    border-radius:20px;
    width:400px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,153,0.3);
}

.player h1{
    margin-bottom:20px;
    color:#00ff99;
    font-size:22px;
}

button{
    background:#00ff99;
    border:none;
    padding:12px 20px;
    margin:10px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}

input{
    margin-top:15px;
    width:100%;
}

.status{
    margin-top:15px;
    color:#aaa;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>KrtlMusic</h2>

    <div id="musicList"></div>

    <input type="file" id="upload" multiple accept="audio/mp3,audio/mpeg">
</div>

<div class="main">
    <div class="player">

        <h1 id="songName">Müzik Seçilmedi</h1>

        <button id="playBtn">▶ Oynat</button>
        <button id="pauseBtn">⏸ Duraklat</button>

        <br>

        <button id="effectBtn">Reverb OFF</button>

        <div class="status" id="status">
            Efektler Kapalı
        </div>

    </div>
</div>

<script>
const audio = new Audio();
audio.crossOrigin = "anonymous";

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioContext = new AudioContextClass();

const source = audioContext.createMediaElementSource(audio);

let effectsEnabled = false;
let panInterval;

// BASS BOOST
const bassBoost = audioContext.createBiquadFilter();
bassBoost.type = "lowshelf";
bassBoost.frequency.value = 200;
bassBoost.gain.value = 15;

// REVERB / YANKI
const delayNode = audioContext.createDelay();
delayNode.delayTime.value = 0.25;

const feedback = audioContext.createGain();
feedback.gain.value = 0.35;

// 8D
const panner = audioContext.createStereoPanner();

// NORMAL BAĞLANTI
function connectNormal(){

    source.disconnect();
    bassBoost.disconnect();
    panner.disconnect();
    delayNode.disconnect();
    feedback.disconnect();

    source.connect(audioContext.destination);
}

// EFEKTLİ BAĞLANTI
function connectEffects(){

    source.disconnect();
    bassBoost.disconnect();
    panner.disconnect();
    delayNode.disconnect();
    feedback.disconnect();

    source.connect(bassBoost);
    bassBoost.connect(panner);
    panner.connect(delayNode);
    delayNode.connect(feedback);
    feedback.connect(delayNode);
    delayNode.connect(audioContext.destination);
}

connectNormal();

// MÜZİK YÜKLE
const upload = document.getElementById("upload");
const musicList = document.getElementById("musicList");

upload.addEventListener("change", function(e){

    const files = e.target.files;

    for(let file of files){

        const item = document.createElement("div");
        item.className = "music-item";
        item.innerText = file.name;

        item.addEventListener("click", function(){

            const url = URL.createObjectURL(file);

            audio.src = url;

            document.getElementById("songName").innerText = file.name;
        });

        musicList.appendChild(item);
    }
});

// PLAY
const playBtn = document.getElementById("playBtn");

playBtn.addEventListener("click", async function(){

    await audioContext.resume();

    if(audio.src){
        audio.play();
    }else{
        alert("Önce müzik seç!");
    }
});

// PAUSE
const pauseBtn = document.getElementById("pauseBtn");

pauseBtn.addEventListener("click", function(){
    audio.pause();
});

// EFEKT
const effectBtn = document.getElementById("effectBtn");

function start8D(){

    clearInterval(panInterval);

    panInterval = setInterval(() => {
        panner.pan.value = Math.sin(Date.now() / 500);
    }, 20);
}

function stop8D(){

    clearInterval(panInterval);
    panner.pan.value = 0;
}

effectBtn.addEventListener("click", function(){

    effectsEnabled = !effectsEnabled;

    if(effectsEnabled){

        connectEffects();
        start8D();

        effectBtn.innerText = "Reverb ON";

        document.getElementById("status").innerText = "8D + Bass + Reverb + Yankı Açık";

    }else{

        connectNormal();
        stop8D();

        effectBtn.innerText = "Reverb OFF";

        document.getElementById("status").innerText = "Efektler Kapalı";
    }
});
</script>

</body>
</html>
```
