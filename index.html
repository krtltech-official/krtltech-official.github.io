<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>krtlCall - Cloud Engine</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #0b0c10; color: #c5c6c7;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px; overflow-x: hidden;
    }

    /* ÜST PANEL: ID BİLGİSİ */
    .top-bar {
      width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
      align-items: center; background: rgba(31, 40, 51, 0.6);
      backdrop-filter: blur(12px); padding: 15px 25px; border-radius: 16px;
      border: 1px solid rgba(102, 252, 241, 0.2); margin-bottom: 25px;
    }
    .logo { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
    .logo span { color: #66fcf1; }
    .my-id-container { display: flex; align-items: center; gap: 10px; }
    .id-badge {
      background: #1f2833; color: #66fcf1; padding: 8px 16px;
      border-radius: 8px; font-weight: 700; letter-spacing: 2px;
      border: 1px solid #66fcf1; font-size: 1.1rem;
    }

    /* SOL ÜST GELEN ÇAĞRI BİLDİRİMİ (POPUP) */
    .incoming-call-toast {
      position: fixed; top: 20px; left: -400px; width: 320px;
      background: #1f2833; border-left: 5px solid #66fcf1;
      padding: 15px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 9999; display: flex; flex-direction: column; gap: 12px;
      transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .incoming-call-toast.show { left: 20px; }
    .caller-info { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; }
    .toast-buttons { display: flex; gap: 10px; }
    .btn-toast {
      flex: 1; padding: 8px; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-accept { background: #45f3ff; color: #000; }
    .btn-decline { background: #ff4757; color: #fff; }

    /* ANA BAĞLANTI PANELİ */
    .connect-panel {
      width: 100%; max-width: 450px; background: #151a21;
      padding: 25px; border-radius: 16px; border: 1px solid #1f2833;
      text-align: center; margin-bottom: 25px; position: relative;
    }
    .search-container { position: relative; width: 100%; margin-bottom: 15px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #1f2833;
      background: #0b0c10; color: #fff; font-size: 1rem; outline: none;
      transition: 0.3s; text-align: center; letter-spacing: 1px;
    }
    input:focus { border-color: #66fcf1; box-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }
    
    /* Otomatik Tamamlama Listesi */
    .autocomplete-list {
      position: absolute; top: 100%; left: 0; width: 100%;
      background: #1f2833; border-radius: 8px; border: 1px solid #444;
      max-height: 150px; overflow-y: auto; z-index: 10; display: none;
    }
    .autocomplete-item {
      padding: 12px; cursor: pointer; text-align: left; color: #fff;
      border-bottom: 1px solid #151a21;
    }
    .autocomplete-item:hover { background: #66fcf1; color: #000; font-weight: bold; }

    .btn-main {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.2s; background: #66fcf1; color: #0b0c10;
    }
    .btn-main:hover { background: #45f3ff; transform: translateY(-2px); }

    /* VİDEO GRID */
    .video-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      width: 100%; max-width: 1100px; margin-bottom: 25px;
    }
    .video-wrapper {
      position: relative; background: #151a21; border-radius: 16px;
      overflow: hidden; aspect-ratio: 16/10; border: 1px solid #1f2833;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .mirror { transform: scaleX(-1); }
    .video-tag {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(11, 12, 16, 0.8); padding: 6px 14px;
      border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1); color: #fff;
    }

    /* ALT MEDYA KONTROLLERİ */
    .media-controls { display: flex; gap: 20px; }
    .btn-circle {
      width: 55px; height: 55px; border-radius: 50%; border: none;
      background: #1f2833; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-circle:hover { background: #2c3540; color: #66fcf1; }
    .btn-hangup-main { background: #ff4757 !important; }
    .btn-hangup-main:hover { background: #ff6b81 !important; }
    .muted-mode { background: #ff4757 !important; color: #fff !important; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo">krtl<span>Call</span></div>
    <div class="my-id-container">
      <span style="font-size: 0.9rem; color: #95a5a6;">Senin ID Kodun:</span>
      <div class="id-badge" id="my-id">Sistem Başlatılıyor...</div>
    </div>
  </div>

  <div class="incoming-call-toast" id="incoming-toast">
    <div class="caller-info">
      <span class="material-icons" style="color: #66fcf1;">phone_in_talk</span>
      <span id="caller-id-text">Gelen Çağrı...</span>
    </div>
    <div class="toast-buttons">
      <button class="btn-toast btn-accept" id="accept-btn">
        <span class="material-icons">call</span> Kabul Et
      </button>
      <button class="btn-toast btn-decline" id="decline-btn">
        <span class="material-icons">call_end</span> Reddet
      </button>
    </div>
  </div>

  <div class="connect-panel">
    <div class="search-container">
      <input type="text" id="target-id-input" placeholder="Bağlanılacak ID Yazın..." maxlength="5">
      <div class="autocomplete-list" id="autocomplete-box"></div>
    </div>
    <button class="btn-main" id="connect-btn">
      <span class="material-icons">bolt</span> ID'ye Doğrudan Bağlan
    </button>
  </div>

  <div class="video-grid">
    <div class="video-wrapper">
      <video id="localVideo" autoplay playsinline muted class="mirror"></video>
      <div class="video-tag">Senin Kameran</div>
    </div>
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-tag" id="remote-tag">Karşı Taraf (Bekleniyor)</div>
    </div>
  </div>

  <div class="media-controls">
    <button class="btn-circle" id="mic-toggle"><span class="material-icons">mic</span></button>
    <button class="btn-circle" id="cam-toggle"><span class="material-icons">videocam</span></button>
    <button class="btn-circle btn-hangup-main" id="hangup-btn"><span class="material-icons">call_end</span></button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // Senin Paylaştığın Yapılandırma Verileri
    const firebaseConfig = {
      apiKey: "AIzaSyCPfjy0W_FFd0lm6IfS490QL6PU9AODSHY",
      authDomain: "krtlai.firebaseapp.com",
      projectId: "krtlai",
      storageBucket: "krtlai.firebasestorage.app",
      messagingSenderId: "1035148986528",
      appId: "1:1035148986528:web:359d8a74025ffdc1d4a1c5",
      measurementId: "G-CFEYN4P022"
    };

    // Firebase ve Firestore Servislerini Başlatıyoruz
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let localStream = null;
    let peer = null;
    let currentCall = null;
    let incomingCallRef = null;
    let myGeneratedID = "";
    let micMuted = false;
    let camMuted = false;

    // Elementlerin Seçimi
    const myIdDisplay = document.getElementById('my-id');
    const targetInput = document.getElementById('target-id-input');
    const autocompleteBox = document.getElementById('autocomplete-box');
    const connectBtn = document.getElementById('connect-btn');
    const incomingToast = document.getElementById('incoming-toast');
    const callerIdText = document.getElementById('caller-id-text');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteTag = document.getElementById('remote-tag');

    // 🎲 5 HANELİ RASTGELE ID GENERATOR
    function generateShortID() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // 🚀 ANA MOTORU ÇALIŞTIR
    async function initPlatform() {
      try {
        // 1. Donanımı Aç
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;

        // 2. ID Üret ve PeerJS Başlat
        myGeneratedID = generateShortID();
        peer = new Peer(myGeneratedID);

        peer.on('open', async (id) => {
          myIdDisplay.textContent = id;
          
          // 🔥 CLOUD ADIMI: Üretilen 5 haneli ID'yi Firestore "online_users" koleksiyonuna kaydet
          await setDoc(doc(db, "online_users", id), {
            userId: id,
            timestamp: Date.now()
          });
          console.log("ID Firestore Bulutuna Yazıldı:", id);
        });

        // 🚨 3. BİRİ BİZİ ARADIĞINDA POPUP FIRLAT
        peer.on('call', (call) => {
          incomingCallRef = call;
          callerIdText.textContent = `ID: ${call.peer} Arıyor...`;
          incomingToast.classList.add('show');
        });

      } catch (err) {
        console.error("Başlatma hatası:", err);
        alert("Kamera/Mikrofon izni şart kanka!");
      }
    }

    // 🔍 CLOUD AUTOCOMPLETE (Firestore'dan Canlı Eşleşen ID'leri Çekme)
    targetInput.addEventListener('input', async (e) => {
      const val = e.target.value.toUpperCase();
      targetInput.value = val;
      autocompleteBox.innerHTML = '';
      
      // En az 2 karakter yazıldığında tetiklenir
      if (val.length >= 2) {
        try {
          // Firestore'daki aktif kullanıcıları oku
          const querySnapshot = await getDocs(collection(db, "online_users"));
          let matches = [];
          
          querySnapshot.forEach((doc) => {
            const activeId = doc.id;
            // Kendi ID'mizi listede önermeyelim ve arama kriteri uysun
            if (activeId.startsWith(val) && activeId !== myGeneratedID) {
              matches.push(activeId);
            }
          });

          if (matches.length > 0) {
            autocompleteBox.style.display = 'block';
            matches.forEach(match => {
              const item = document.createElement('div');
              item.className = 'autocomplete-item';
              item.textContent = match;
              item.onclick = () => {
                targetInput.value = match;
                autocompleteBox.style.display = 'none';
              };
              autocompleteBox.appendChild(item);
            });
          } else {
            autocompleteBox.style.display = 'none';
          }
        } catch (error) {
          console.error("Firestore'dan veri çekilemedi:", error);
        }
      } else {
        autocompleteBox.style.display = 'none';
      }
    });

    // 📞 DIŞARIYI ARAMA BUTONU
    connectBtn.addEventListener('click', () => {
      const targetID = targetInput.value.trim();
      if (targetID.length !== 5) return alert("5 haneli ID şart kanka!");

      remoteTag.textContent = `Aranıyor: ${targetID}...`;
      
      const call = peer.call(targetID, localStream);
      currentCall = call;

      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        remoteTag.textContent = `Canlı Görüşme: ${targetID}`;
      });
    });

    // ✔️ GELEN ÇAĞRIYI ONAYLA (Sol Üst)
    document.getElementById('accept-btn').addEventListener('click', () => {
      if (incomingCallRef) {
        incomingToast.classList.remove('show');
        incomingCallRef.answer(localStream);
        currentCall = incomingCallRef;

        currentCall.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteTag.textContent = `Canlı Görüşme: ${currentCall.peer}`;
        });
      }
    });

    // ❌ GELEN ÇAĞRIYI REDDET
    document.getElementById('decline-btn').addEventListener('click', () => {
      incomingToast.classList.remove('show');
      if (incomingCallRef) {
        incomingCallRef.close();
        incomingCallRef = null;
      }
    });

    // 🎙️ MİKROFON KONTROLÜ
    document.getElementById('mic-toggle').addEventListener('click', () => {
      micMuted = !micMuted;
      localStream.getAudioTracks()[0].enabled = !micMuted;
      document.getElementById('mic-toggle').classList.toggle('muted-mode', micMuted);
      document.getElementById('mic-toggle').querySelector('.material-icons').textContent = micMuted ? 'mic_off' : 'mic';
    });

    // 📹 KAMERA KONTROLÜ
    document.getElementById('cam-toggle').addEventListener('click', () => {
      camMuted = !camMuted;
      localStream.getVideoTracks()[0].enabled = !camMuted;
      document.getElementById('cam-toggle').classList.toggle('muted-mode', camMuted);
      document.getElementById('cam-toggle').querySelector('.material-icons').textContent = camMuted ? 'videocam_off' : 'videocam';
    });

    // 🛑 GÖRÜŞMEYİ KAPAT
    document.getElementById('hangup-btn').addEventListener('click', () => {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      remoteVideo.srcObject = null;
      remoteTag.textContent = "Görüşme Sonlandırıldı.";
    });

    // 🧹 ÇIKIŞ KONTROLÜ: Kullanıcı sekmeyi veya siteyi kapattığında Firestore'daki ID'sini otomatik siler!
    window.addEventListener('beforeunload', async () => {
      if (myGeneratedID) {
        await deleteDoc(doc(db, "online_users", myGeneratedID));
      }
    });

    document.addEventListener('click', (e) => {
      if (e.target !== targetInput) autocompleteBox.style.display = 'none';
    });

    // Tetikleyiciyi ateşle
    initPlatform();
  </script>
</body>
</html>
