<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>krtlCall Enterprise (Max 25 Person + AI Moderation)</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #08090c; color: #a8b2c1;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px; overflow-x: hidden;
    }

    /* ÜST BAR */
    .top-bar {
      width: 100%; max-width: 1300px; display: flex; justify-content: space-between;
      align-items: center; background: rgba(17, 22, 32, 0.7);
      backdrop-filter: blur(12px); padding: 15px 25px; border-radius: 16px;
      border: 1px solid rgba(69, 243, 255, 0.1); margin-bottom: 20px;
    }
    .logo { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .logo span { color: #45f3ff; }
    .ai-badge {
      background: rgba(255, 71, 87, 0.1); color: #ff4757;
      padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;
      font-weight: 700; border: 1px solid rgba(255, 71, 87, 0.3);
      display: flex; align-items: center; gap: 5px;
    }

    /* AI UYARI TOAST (SOL ÜST) */
    .ai-alert-toast {
      position: fixed; top: 20px; left: -450px; width: 350px;
      background: #1e1315; border-left: 5px solid #ff4757;
      padding: 20px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      z-index: 99999; transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ai-alert-toast.show { left: 20px; }
    .ai-alert-title { color: #ff4757; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

    /* ODA BAĞLANTI PANELİ */
    .room-panel {
      width: 100%; max-width: 500px; background: #111620;
      padding: 25px; border-radius: 16px; border: 1px solid #1c2333;
      text-align: center; margin-bottom: 25px;
    }
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input {
      flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #1c2333;
      background: #08090c; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
    }
    input:focus { border-color: #45f3ff; }
    
    .btn-action {
      flex: 1; padding: 14px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-create { background: #1c2333; color: #45f3ff; border: 1px solid rgba(69, 243, 255, 0.2); }
    .btn-join { background: #45f3ff; color: #08090c; }
    .btn-create:hover, .btn-join:hover { transform: translateY(-2px); filter: brightness(1.1); }

    /* DİNAMİK 25 KİŞİLİK VİDEO GRID */
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px; width: 100%; max-width: 1300px; margin-bottom: 25px;
    }
    .video-wrapper {
      position: relative; background: #111620; border-radius: 14px;
      overflow: hidden; aspect-ratio: 16/10; border: 1px solid #1c2333;
    }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .mirror { transform: scaleX(-1); }
    .video-tag {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(8, 9, 12, 0.8); padding: 5px 12px;
      border-radius: 6px; font-size: 0.8rem; color: #fff;
    }

    /* MEDYA KONTROLLERİ */
    .controls { display: flex; gap: 15px; }
    .btn-circle {
      width: 55px; height: 55px; border-radius: 50%; border: none;
      background: #111620; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .btn-circle:hover { background: #1c2333; color: #45f3ff; }
    .btn-hangup { background: #ff4757 !important; }
    .muted { background: #ff4757 !important; }
  </style>
</head>
<body>

  <div class="ai-alert-toast" id="ai-toast">
    <div class="ai-alert-title">
      <span class="material-icons">gavel</span> AI GÜVENLİK SİSTEMİ
    </div>
    <p style="margin-top: 10px; font-size: 0.9rem; color: #fbc4c4;" id="ai-toast-text">
      Ses akışında kural dışı kelime/küfür algılandı! Arama güvenlik nedeniyle sonlandırılıyor.
    </p>
  </div>

  <div class="top-bar">
    <div class="logo">krtl<span>Call</span> <small style="font-size: 0.7rem; color: #45f3ff;">v2.0 PRO</small></div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <div class="ai-badge"><span class="material-index" style="font-size: 14px;">psychology</span> AI CANLI MODERASYON AKTİF</div>
      <div style="font-size: 0.9rem;">Senin Peer ID'n: <strong id="my-peer-id" style="color:#45f3ff;">---</strong></div>
    </div>
  </div>

  <div class="room-panel">
    <div class="input-group">
      <input type="text" id="room-id-input" placeholder="Oda ID'si girin veya oluşturun..." maxlength="6">
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-action btn-create" id="btn-create-room">
        <span class="material-icons">add_box</span> Oda Kur
      </button>
      <button class="btn-action btn-join" id="btn-join-room">
        <span class="material-icons">group_add</span> Odaya Katıl (Max 25)
      </button>
    </div>
    <div id="room-status" style="margin-top: 12px; font-size: 0.85rem; color: #45f3ff;"></div>
  </div>

  <div class="video-grid" id="grid-container">
    <div class="video-wrapper">
      <video id="localVideo" autoplay playsinline muted class="mirror"></video>
      <div class="video-tag">Sen (Modere Ediliyor)</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-circle" id="btn-mic"><span class="material-icons">mic</span></button>
    <button class="btn-circle" id="btn-cam"><span class="material-icons">videocam</span></button>
    <button class="btn-circle btn-hangup" id="btn-hangup"><span class="material-icons">call_end</span></button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion, arrayRemove, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPfjy0W_FFd0lm6IfS490QL6PU9AODSHY",
      authDomain: "krtlai.firebaseapp.com",
      projectId: "krtlai",
      storageBucket: "krtlai.firebasestorage.app",
      messagingSenderId: "1035148986528",
      appId: "1:1035148986528:web:359d8a74025ffdc1d4a1c5",
      measurementId: "G-CFEYN4P022"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let localStream = null;
    let peer = null;
    let myPeerId = "";
    let currentRoomId = null;
    let connectedPeers = {}; // Bağlı olan kullanıcı çağrı listesi
    let aiInterval = null;

    // Kara Liste (Temsili Küfür Havuzu - Burayı genişletebilirsin kanka)
    const badWords = ["küfür1", "küfür2", "salak", "aptal", "mal"]; 

    const gridContainer = document.getElementById('grid-container');
    const localVideo = document.getElementById('localVideo');
    const roomIdInput = document.getElementById('room-id-input');
    const roomStatus = document.getElementById('room-status');
    const aiToast = document.getElementById('ai-toast');

    // 🚀 1. DONANIMI VE PEERJS'İ BAŞLAT
    async function init() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;

        peer = new Peer();
        peer.on('open', (id) => {
          myPeerId = id;
          document.getElementById('my-peer-id').textContent = id;
        });

        // 📞 GELEN ÇOKLU ÇAĞRILARI KARŞILAMA
        peer.on('call', (call) => {
          call.answer(localStream);
          call.on('stream', (remoteStream) => {
            addRemoteVideo(call.peer, remoteStream);
          });
          connectedPeers[call.peer] = call;
        });

        // 🔥 AI MODERASYON MOTORUNU ÇATEKLE
        startAIModeration();

      } catch (err) {
        alert("Kamera/Mikrofon izni olmadan sisteme giriş yapılamaz kanka.");
      }
    }

    // 🎙️ 2. YAPAY ZEKA SES DENETİMİ (Web Speech API)
    function startAIModeration() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.log("Tarayıcında AI ses tanıma desteklenmiyor kanka.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'tr-TR';

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          let text = event.results[i][0].transcript.toLowerCase();
          console.log("AI Canlı Çözümleme: ", text);

          // Her saniye gelen metin akışında küfür filtresi çalıştır
          badWords.forEach(word => {
            if (text.includes(word)) {
              triggerAIShutdown(word);
            }
          });
        }
      };

      recognition.onerror = () => { recognition.start(); };
      recognition.onend = () => { recognition.start(); };
      recognition.start();
    }

    // 🛑 3. AI ÇAĞRIYI SAKATLAYIP KAPATMA MOTORU
    function triggerAIShutdown(detectedWord) {
      document.getElementById('ai-toast-text').innerHTML = `Ses akışında kural dışı kelime (<strong>${detectedWord}</strong>) algılandı! Görüşme AI tarafından sonlandırıldı.`;
      aiToast.classList.add('show');
      
      setTimeout(() => {
        aiToast.classList.remove('show');
        hangUp();
      }, 4000);
    }

    // 🏢 4. ODA KURMA MANTIĞI (Firestore)
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const roomId = Math.floor(100000 + Math.random() * 900000).toString(); // 6 Haneli oda kodu
      roomIdInput.value = roomId;
      currentRoomId = roomId;

      await setDoc(doc(db, "rooms", roomId), {
        users: [myPeerId],
        createdAt: Date.now()
      });

      roomStatus.textContent = `Oda başarıyla kuruldu! ID'yi arkadaşlarına dağıt.`;
      listenRoomChanges(roomId);
    });

    // 🤝 5. ODAYA KATILMA MANTIĞI (Max 25 Kişi Kontrolü)
    document.getElementById('btn-join-room').addEventListener('click', async () => {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Lütfen geçerli bir Oda ID'si gir kanka!");

      const roomRef = doc(db, "rooms", roomId);
      const roomSnap = await getDoc(roomRef);

      if (roomSnap.exists()) {
        const currentUsers = roomSnap.data().users || [];
        
        // CRITICAL CHECK: Max 25 Kişi Kontrolü
        if (currentUsers.length >= 25) {
          return alert("Oda maksimum kapasiteye (25 kişi) ulaştı kanka! İçeri giremezsin.");
        }

        currentRoomId = roomId;
        await updateDoc(roomRef, {
          users: arrayUnion(myPeerId)
        });

        // Odadaki diğer herkesi sırayla ara (Mesh Network)
        currentUsers.forEach(userId => {
          if (userId !== myPeerId) {
            const call = peer.call(userId, localStream);
            call.on('stream', (remoteStream) => {
              addRemoteVideo(userId, remoteStream);
            });
            connectedPeers[userId] = call;
          }
        });

        listenRoomChanges(roomId);
      } else {
        alert("Böyle bir oda bulunamadı kanka.");
      }
    });

    // 🔄 6. ODA DEĞİŞİKLİKLERİNİ CANLI DİNLEME (Firestore Realtime)
    function listenRoomChanges(roomId) {
      onSnapshot(doc(db, "rooms", roomId), (doc) => {
        if (!doc.exists()) return;
        const data = doc.data();
        roomStatus.textContent = `Odadaki Toplam Kişi: ${data.users.length} / 25`;
      });
    }

    // 📹 DİNAMİK VİDEO EKLEME
    function addRemoteVideo(userId, stream) {
      if (document.getElementById(`wrap-${userId}`)) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'video-wrapper';
      wrapper.id = `wrap-${userId}`;

      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;

      const tag = document.createElement('div');
      tag.className = 'video-tag';
      tag.textContent = `Kullanıcı: ${userId.substring(0, 5)}`;

      wrapper.appendChild(video);
      wrapper.appendChild(tag);
      gridContainer.appendChild(wrapper);
    }

    // 🛑 BAĞLANTIYI KOPARMA
    function hangUp() {
      Object.keys(connectedPeers).forEach(userId => {
        if (connectedPeers[userId]) connectedPeers[userId].close();
        const el = document.getElementById(`wrap-${userId}`);
        if (el) el.remove();
      });
      connectedPeers = {};

      if (currentRoomId) {
        updateDoc(doc(db, "rooms", currentRoomId), {
          users: arrayRemove(myPeerId)
        });
      }
      roomStatus.textContent = "Görüşmeden ayrılındı.";
    }

    document.getElementById('btn-hangup').addEventListener('click', hangUp);

    // MİKROFON & KAMERA BUTONLARI
    document.getElementById('btn-mic').addEventListener('click', () => {
      const enabled = localStream.getAudioTracks()[0].enabled;
      localStream.getAudioTracks()[0].enabled = !enabled;
      document.getElementById('btn-mic').classList.toggle('muted', enabled);
    });

    document.getElementById('btn-cam').addEventListener('click', () => {
      const enabled = localStream.getVideoTracks()[0].enabled;
      localStream.getVideoTracks()[0].enabled = !enabled;
      document.getElementById('btn-cam').classList.toggle('muted', enabled);
    });

    // Motoru çalıştır kanka
    window.onload = init;
  </script>
</body>
</html>
