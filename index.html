<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erken Erişim KrtlTech Şarkıları</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .playlist {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .playlist li {
            padding: 10px 12px;
            margin-bottom: 6px;
            background-color: #0f172a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist li:hover {
            background-color: #334155;
            color: #38bdf8;
        }
        .playlist li.active {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: bold;
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>KrtlTech Erken Erişim</h1>
        <p class="subtitle">Gizli Stüdyo Kayıtları</p>
        
        <!-- Ses Oynatıcı -->
        <audio id="audioPlayer" controls></audio>

        <!-- Şarkı Listesi -->
        <ul id="playlist" class="playlist">
            <!-- Otomatik olarak yüklenecek -->
        </ul>

        <div class="info">Klasördeki tüm sesler listelenir.</div>
    </div>

    <script>
        // KLANIN/KLASÖRÜN SES DOSYALARI (Buraya aynı klasördeki müziklerin dosya adlarını yazıyorsun kanka)
        // Örn: "sunucu_bende.mp3", "remix2.mp3" gibi.
        const tracks = [
            { name: "Sunucu Bende (Erken Erişim)", file: "Sunucu_Bende.mp3" },
            // Buraya yeni şarkı eklemek istersen aynen şu formatta çoğaltabilirsin:
            // { name: "Şarkı Adı", file: "dosya_adi.mp3" },
        ];

        const audioPlayer = document.getElementById('audioPlayer');
        const playlistElement = document.getElementById('playlist');
        let currentTrackIndex = 0;

        function loadTrack(index) {
            if (tracks.length === 0) return;
            currentTrackIndex = index;
            audioPlayer.src = tracks[index].file;
            audioPlayer.play();
            
            // Aktif sınıfını güncelle
            const items = playlistElement.querySelectorAll('li');
            items.forEach((li, idx) => {
                if (idx === index) {
                    li.classList.add('active');
                } else {
                    li.classList.remove('active');
                }
            });
        }

        function initPlaylist() {
            playlistElement.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${track.name}`;
                li.addEventListener('click', () => {
                    loadTrack(index);
                });
                playlistElement.appendChild(li);
            });

            if (tracks.length > 0) {
                audioPlayer.src = tracks[0].file;
                playlistElement.children[0].classList.add('active');
            }
        }

        // Şarkı bitince sıradakine geçsin
        audioPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
        });

        initPlaylist();
    </script>
</body>
</html>
