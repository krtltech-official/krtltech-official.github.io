<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>KrtlMusic</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #58a6ff; padding: 40px; border-radius: 20px; text-align: center; }
        .upload-btn { background: #58a6ff; color: #000; padding: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="box">
        <h1>KRTLMUSIC</h1>
        <p>Dosyanı seç, efektler otomatik devreye girsin:</p>
        <input type="file" id="file" style="display:none;" accept="audio/*">
        <label for="file" class="upload-btn">📂 ŞARKI SEÇ</label>
        <br><br>
        <audio id="audio" controls style="width: 300px;"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        let ctx, panner, bass, reverb;

        document.getElementById('file').onchange = (e) => {
            const file = e.target.files[0];
            audio.src = URL.createObjectURL(file);
            
            if(!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                const source = ctx.createMediaElementSource(audio);
                bass = ctx.createBiquadFilter(); bass.type = 'lowshelf'; bass.gain.value = 15;
                reverb = ctx.createConvolver();
                panner = ctx.createStereoPanner();
                
                // Yankı için basit buffer
                const rate = 44100, len = rate * 1.5;
                const buf = ctx.createBuffer(2, len, rate);
                reverb.buffer = buf;
                
                source.connect(bass).connect(reverb).connect(panner).connect(ctx.destination);
                
                let angle = 0;
                setInterval(() => { panner.pan.value = Math.sin(angle); angle += 0.05; }, 50);
            }
            audio.play();
        };
    </script>
</body>
</html>
