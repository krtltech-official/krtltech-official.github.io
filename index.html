<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>KrtlMusic Ultimate Playlist</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Menü */
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid #30363d; display: flex; flex-direction: column; padding: 20px; }
        .upload-btn { background: var(--accent); color: #000; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .playlist { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; }
        .playlist li { background: #21262d; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border: 1px solid #30363d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist li.active { border-color: var(--accent); color: var(--accent); }

        /* Ana Alan */
        .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player { background: var(--panel); padding: 40px; border-radius: 20px; text-align: center; width: 80%; max-width: 500px; border: 1px solid #30363d; }
        #visualizer { width: 100%; height: 120px; background: #000; border-radius: 10px; margin-bottom: 20px; }
        .controls button { padding: 15px 30px; margin: 5px; border-radius: 30px; border: 1px solid var(--accent); background: transparent; color: white; cursor: pointer; font-weight: bold; }
        .controls button:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>KrtlMusic List</h2>
        <div class="upload-btn" onclick="document.getElementById('fileInput').click()">➕ ÇOKLU ŞARKI EKLE</div>
        <input type="file" id="fileInput" multiple accept="audio/*" style="display:none;">
        <ul class="playlist" id="playlist"></ul>
    </div>

    <div class="main">
        <div class="player">
            <h1>KRTLMUSIC</h1>
            <canvas id="visualizer"></canvas>
            <p id="track-name">Bir şarkı seç kanka...</p>
            <audio id="audio"></audio>
            <div class="controls">
                <button onclick="playMusic()">▶ OYNAT</button>
                <button onclick="pauseMusic()">⏸ DURDUR</button>
            </div>
            <p style="font-size: 0.7rem; color: #8b949e;">Efektler: 8D + Reverb + Bass</p>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playlist = document.getElementById('playlist');
        const fileInput = document.getElementById('fileInput');
        const trackName = document.getElementById('track-name');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, source, panner, bass, reverb, analyser;
        let tracks = [];

        // Ses Motoru Kurulumu
        function setupAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audio);
            
            bass = audioCtx.createBiquadFilter();
            bass.type = 'lowshelf';
            bass.gain.value = 15;
            bass.frequency.value = 150;

            reverb = audioCtx.createConvolver();
            const rate = audioCtx.sampleRate;
            const impulse = audioCtx.createBuffer(2, rate * 1.5, rate);
            reverb.buffer = impulse;

            panner = audioCtx.createStereoPanner();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            source.connect(bass).connect(reverb).connect(panner).connect(analyser).connect(audioCtx.destination);
            
            // 8D Efekt Döngüsü
            let angle = 0;
            setInterval(() => { panner.pan.value = Math.sin(angle); angle += 0.05; }, 50);
            draw();
        }

        // Çoklu Dosya Yükleme
        fileInput.onchange = (e) => {
            Array.from(e.target.files).forEach(file => {
                const track = { name: file.name, url: URL.createObjectURL(file) };
                tracks.push(track);
                const li = document.createElement('li');
                li.innerText = track.name;
                li.onclick = () => selectTrack(tracks.indexOf(track), li);
                playlist.appendChild(li);
            });
        };

        function selectTrack(index, li) {
            document.querySelectorAll('.playlist li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            audio.src = tracks[index].url;
            trackName.innerText = "Çalıyor: " + tracks[index].name;
            setupAudio();
            audio.play();
        }

        function playMusic() { if(audio.src) { audioCtx.resume(); audio.play(); } }
        function pauseMusic() { audio.pause(); }

        // Görselleştirici Çizimi
        function draw() {
            requestAnimationFrame(draw);
            if(!analyser) return;
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.fillStyle = '#58a6ff';
            data.forEach((val, i) => {
                const h = (val / 255) * canvas.height;
                canvasCtx.fillRect(i * 3, canvas.height - h, 2, h);
            });
        }
    </script>
</body>
</html>
