<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrtlMusic - Canlı Yükleme Paneli</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Menü */
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Dosya Seçme Butonu */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }

        .upload-btn {
            border: 2px dashed var(--accent-color);
            color: var(--accent-color);
            background-color: transparent;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .upload-btn:hover {
            background: rgba(88, 166, 255, 0.1);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .playlist li {
            padding: 12px;
            background: #21262d;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist li:hover, .playlist li.active {
            border-color: var(--accent-color);
            background: #30363d;
            color: var(--accent-color);
        }

        /* Ana Panel */
        .main-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .player-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 450px;
        }

        .player-card h1 {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .player-card .sub {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .now-playing {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 1.1rem;
            min-height: 24px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        .fx-panel {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .fx-title {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .fx-badge {
            background: #238636;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(35, 134, 54, 0.4);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>KrtlMusic List</h2>
        
        <div class="upload-btn-wrapper">
            <button class="upload-btn">➕ Şarkı Ekle (.mp3)</button>
            <input type="file" id="audio-upload" accept="audio/*" multiple />
        </div>

        <ul class="playlist" id="playlist">
            </ul>
    </div>

    <div class="main-panel">
        <div class="player-card">
            <h1>KRTLMUSIC</h1>
            <div class="sub">BY KRTLTECH</div>

            <div class="now-playing" id="track-title">Lütfen sol menüden şarkı yükle kanka</div>

            <div class="controls">
                <button class="btn" onclick="playMusic()">Oynat</button>
                <button class="btn" onclick="pauseMusic()">Durdur</button>
            </div>

            <div class="fx-panel">
                <div class="fx-title">Aktif Ses Efektleri</div>
                <div class="fx-grid">
                    <div class="fx-badge">8D SOUND</div>
                    <div class="fx-badge">REVERB</div>
                    <div class="fx-badge">MEGA BASS</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio = new Audio();
        audio.loop = true;

        let audioCtx = null;
        let source = null;
        let panner = null;
        let bassFilter = null;
        let reverbNode = null;
        let loadedTracks = []; // Yüklenen şarkıların listesi

        // Web Audio API DJ Motoru
        function initAudioEngine() {
            if (audioCtx) return;

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audio);

            // 1. MEGA BASS (+15dB)
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.setValueAtTime(150, audioCtx.currentTime); 
            bassFilter.gain.setValueAtTime(15, audioCtx.currentTime); 

            // 2. REVERB
            reverbNode = audioCtx.createConvolver();
            createReverbImpulse();

            // 3. 8D PANNER
            panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            let lastNode = source;
            lastNode = lastNode.connect(bassFilter);
            lastNode = lastNode.connect(reverbNode);
            
            if (panner) {
                lastNode = lastNode.connect(panner);
                lastNode.connect(audioCtx.destination);
                start8DEffect();
            } else {
                lastNode.connect(audioCtx.destination);
            }
        }

        function createReverbImpulse() {
            const rate = 44100;
            const len = rate * 2.5; 
            const impulse = new AudioContext().createBuffer(2, len, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < len; i++) {
                const decay = Math.exp(-i / (rate * 1.5));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            reverbNode.buffer = impulse;
        }

        let angle = 0;
        function start8DEffect() {
            setInterval(() => {
                if (panner && audioCtx && !audio.paused) {
                    const panValue = Math.sin(angle);
                    panner.pan.setValueAtTime(panValue, audioCtx.currentTime);
                    angle += 0.03; 
                }
            }, 30);
        }

        function playMusic() {
            if(!audio.src) return;
            initAudioEngine();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audio.play();
        }

        function pauseMusic() {
            audio.pause();
        }

        // KULLANICININ KENDİ DOSYASINI YÜKLEME MEKANİZMASI
        const fileInput = document.getElementById('audio-upload');
        const playlistUI = document.getElementById('playlist');
        const trackTitle = document.getElementById('track-title');

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // Dosyayı tarayıcının çalabileceği geçici bir linke dönüştür
                const fileURL = URL.createObjectURL(file);
                
                const trackData = {
                    name: file.name,
                    url: fileURL
                };
                
                loadedTracks.push(trackData);
                
                // Sol listeye yeni şarkıyı ekle kanka
                const li = document.createElement('li');
                li.innerText = file.name;
                li.setAttribute('data-index', loadedTracks.length - 1);
                
                li.addEventListener('click', function() {
                    document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    
                    const index = this.getAttribute('data-index');
                    selectTrack(index);
                });
                
                playlistUI.appendChild(li);

                // Eğer ilk şarkıysa otomatik olarak seç
                if (loadedTracks.length === 1) {
                    li.classList.add('active');
                    selectTrack(0);
                }
            }
        });

        function selectTrack(index) {
            const track = loadedTracks[index];
            trackTitle.innerText = track.name;
            
            const wasPlaying = !audio.paused;
            audio.src = track.url;
            
            if (wasPlaying) {
                audio.play();
            } else {
                // İlk yüklemede otomatik oynatmayı tetiklemek istersen burayı açabilirsin kanka
                playMusic();
            }
        }
    </script>

</body>
</html>
